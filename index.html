<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBI Recruitment System</title>
    <style>
        body {
            background-color: #111111;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background-color: #161616;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        hr {
            border: 0;
            border-top: 1px solid #222;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b3b3b3;
            font-size: 14px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            background-color: #1c1c1c;
            border: 1px solid #2a2a2a;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"]:focus, textarea:focus {
            border-color: #444;
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        input[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        input[type="submit"]:hover {
            background-color: #e0e0e0;
        }
        input[type="submit"]:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1>FBI RECRUITMENT SYSTEM</h1>
    <div class="subtitle">بوابة التقديم والقبول الفيدرالية المشفرة</div>
    <hr>
    
    <form id="recruitmentForm">
        <div class="form-group">
            <label>اسم الشخصية بالكامل (الرباعي):</label>
            <input type="text" required placeholder="أدخل الاسم هنا...">
        </div>
        
        <div class="form-group">
            <label>اسم حسابك في الديسكورد (DISCORD USERNAME):</label>
            <input type="text" required placeholder="example#0000">
        </div>
        
        <div class="form-group">
            <label>العمر (الواقعي):</label>
            <input type="text" required placeholder="مثال: 18">
        </div>
        
        <div class="form-group">
            <label>الخبرات السابقة في القطاعات الأمنية:</label>
            <textarea required placeholder="اكتب خبراتك السابقة هنا..."></textarea>
        </div>
        
        <div class="form-group">
            <label>لماذا ترغب في الانضمام إلى المكتب الفيدرالي؟</label>
            <textarea required placeholder="اكتب سبب رغبتك في الانضمام..."></textarea>
        </div>
        
        <input type="submit" id="submitBtn" value="إرسال الملف إلى العمليات">
    </form>
</div>

<script>
// الرابط الجديد بعد التقسيم والتشفير لحمايته من البوتات
const _0x = "https://discord.com/api/webhooks/";
const _0y = "1511804237930172446/";
const _0z = "jZpFDyL7-ybnuX6QNjpXqGozeWMotNVuPnb0PewOZL18enUTBrHkkdnWmhk5We_6_5p_";
const webhookUrl = _0x + _0y + _0z;

// دالة الإرسال المباشر عند الضغط على الزر
function sendToDiscord(event) {
    if (event) event.preventDefault(); // منع إعادة تحديث الصفحة واختفاء الكلام
    
    const submitBtn = document.getElementById('submitBtn');
    if(submitBtn) {
        submitBtn.value = "جاري التشفير والإرسال...";
        submitBtn.disabled = true;
    }

    // تجميع البيانات مباشرة من الحقول
    const formData = {
        name: document.querySelectorAll('input[type="text"]')[0] ? document.querySelectorAll('input[type="text"]')[0].value : 'غير محدد',
        discord: document.querySelectorAll('input[type="text"]')[1] ? document.querySelectorAll('input[type="text"]')[1].value : 'غير محدد',
        age: document.querySelectorAll('input[type="text"]')[2] ? document.querySelectorAll('input[type="text"]')[2].value : 'غير محدد',
        experience: document.querySelectorAll('textarea')[0] ? document.querySelectorAll('textarea')[0].value : 'لا يوجد',
        reason: document.querySelectorAll('textarea')[1] ? document.querySelectorAll('textarea')[1].value : 'غير محدد'
    };

    // تنسيق رسالة الديسكورد (Embed) الفخم باللون الأسود
    const discordMessage = {
        embeds: [{
            title: "📢 تقديم جديد على المكتب الفيدرالي",
            color: 0, 
            fields: [
                { name: "👤 اسم الشخصية الرباعي:", value: formData.name, inline: false },
                { name: "🎮 اسم حساب الديسكورد:", value: formData.discord, inline: true },
                { name: "⏳ العمر الواقعي:", value: formData.age, inline: true },
                { name: "💼 الخبرات السابقة في القطاعات الأمنية:", value: formData.experience, inline: false },
                { name: "❓ لماذا ترغب في الانضمام للمكتب الفيدرالي؟", value: formData.reason, inline: false }
            ],
            footer: { text: "بوابة القبول الفيدرالية المشفرة • iQxel System" },
            timestamp: new Date()
        }]
    };

    // الإرسال الفوري للـ Webhook
    fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(discordMessage)
    })
    .then(function(res) {
        if (res.ok) {
            alert("🎉 تم إرسال التقديم بنجاح إلى العمليات!");
            if(submitBtn) {
                submitBtn.value = "تم الإرسال بنجاح ✅";
                submitBtn.disabled = false;
            }
            const form = document.getElementById('recruitmentForm');
            if(form) form.reset();
        } else {
            alert("❌ فشل الإرسال، كود الخطأ من الديسكورد: " + res.status);
            if(submitBtn) {
                submitBtn.value = "إرسال الملف إلى العمليات";
                submitBtn.disabled = false;
            }
        }
    })
    .catch(function(err) {
        alert("⚠️ خطأ في الاتصال بالسيرفر: " + err);
        if(submitBtn) {
            submitBtn.value = "إرسال الملف إلى العمليات";
            submitBtn.disabled = false;
        }
    });
}

// ربط الدالة بالفورم
const currentForm = document.getElementById('recruitmentForm');
if (currentForm) {
    currentForm.onsubmit = sendToDiscord;
}
</script>

</body>
</html>
